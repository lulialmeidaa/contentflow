# Projeto isolado: não altera nenhum outro serviço da VPS.
# A imagem é construída pelo GitHub Actions (.github/workflows/docker.yml).
name: contentflow

services:
  contentflow:
    image: ghcr.io/lulialmeidaa/contentflow:latest
    container_name: contentflow
    env_file: .env
    # Acesso local para testes (curl na própria VPS).
    ports:
      - "127.0.0.1:${CONTENTFLOW_PORT:-3100}:3000"
    # Entra na rede do Cloudflare Tunnel já existente, que publica
    # contentflow.necohouse.com.br → http://contentflow:3000
    networks:
      - default
      - tunnel
    restart: unless-stopped
    mem_limit: 512m

networks:
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:-financas_financas}
